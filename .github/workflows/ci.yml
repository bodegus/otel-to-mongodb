name: CI

on:
  push:

jobs:
  test:
    # arm64, and pinned rather than -latest. The integration tests need the vendored
    # pymongo-embedded wheel, which is built for linux/arm64 and tagged manylinux_2_39: on an
    # x86_64 or a pre-24.04 runner pip would decline it and every integration test would
    # quietly skip. arm64 runners are free for public repositories.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Run tests with coverage
      run: |
        uv run pytest app/tests/ -v --cov=app --cov-report=term-missing --cov-report=xml --tb=line

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  lint:
    # Same runner: `uv sync --all-extras` installs the embedded engine here too.
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Run ruff (replaces flake8, isort, bandit + more)
      run: uv run ruff check app/ --output-format=github --exit-non-zero-on-fix
